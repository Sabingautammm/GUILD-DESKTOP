[package]
name = "guild"
version = "0.1.0"
description = "GUILD desktop wrapper"
authors = ["GUILD"]
edition = "2021"

[lib]
name = "guild_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["webview2-com"] }
tauri-plugin-oauth = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Smaller + faster release binaries
lto = true
codegen-units = 1
strip = true
panic = "abort"
